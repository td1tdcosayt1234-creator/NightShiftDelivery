<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101226">
  <title>Night Shift Delivery</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #080a19;
      color: #f4f7ff;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 50% 0%, rgba(58, 72, 175, .28), transparent 38rem),
        linear-gradient(160deg, #111733, #070914 72%);
    }
    button {
      border: 0;
      border-radius: 14px;
      color: #f6f8ff;
      font: inherit;
      font-weight: 800;
      letter-spacing: .04em;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    button:focus-visible {
      outline: 3px solid #ffffff;
      outline-offset: 3px;
    }
    #app {
      width: min(100%, 1060px);
      padding: clamp(10px, 2vw, 24px);
      position: relative;
    }
    #gameFrame {
      position: relative;
      border: 1px solid rgba(205, 220, 255, .19);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 28px 70px rgba(0, 0, 0, .45), inset 0 0 0 1px rgba(255,255,255,.04);
      background: #0a0d20;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      touch-action: none;
      user-select: none;
    }
    #gameControls {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 12px;
      align-items: center;
      margin-top: 14px;
    }
    .utility {
      display: flex;
      gap: 8px;
    }
    .smallButton {
      min-width: 46px;
      min-height: 46px;
      padding: 0 14px;
      background: #20294e;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.09);
    }
    .smallButton:hover { background: #303b6d; }
    #dpad {
      display: grid;
      grid-template-columns: repeat(3, 46px);
      grid-template-rows: repeat(2, 42px);
      justify-content: center;
      gap: 4px;
    }
    .moveButton {
      min-width: 46px;
      min-height: 40px;
      background: #28345d;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.10);
    }
    .moveButton:hover { background: #37467a; }
    .moveButton[data-move="up"] { grid-column: 2; grid-row: 1; }
    .moveButton[data-move="left"] { grid-column: 1; grid-row: 2; }
    .moveButton[data-move="down"] { grid-column: 2; grid-row: 2; }
    .moveButton[data-move="right"] { grid-column: 3; grid-row: 2; }
    #modeButton {
      min-height: 52px;
      min-width: 224px;
      padding: 0 20px;
      background: linear-gradient(130deg, #5579ed, #9d53eb);
      box-shadow: 0 8px 22px rgba(86, 93, 230, .28), inset 0 0 0 1px rgba(255,255,255,.22);
    }
    #modeButton[data-mode="night"] {
      background: linear-gradient(130deg, #a63fed, #5038b9);
      box-shadow: 0 8px 22px rgba(159, 62, 235, .30), inset 0 0 0 1px rgba(255,255,255,.22);
    }
    #modeButton:active, .moveButton:active, .smallButton:active, .modalButton:active { transform: translateY(1px) scale(.99); }
    #modal {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(4, 6, 16, .67);
      backdrop-filter: blur(5px);
    }
    #modal.hidden { display: none; }
    #modalCard {
      width: min(100%, 450px);
      padding: 28px;
      border: 1px solid rgba(207, 222, 255, .22);
      border-radius: 22px;
      background: linear-gradient(150deg, rgba(32,40,82,.98), rgba(13,16,40,.98));
      box-shadow: 0 28px 80px rgba(0,0,0,.5);
      text-align: center;
    }
    #modalCard h2 {
      margin: 0 0 8px;
      font-size: clamp(1.4rem, 4vw, 2rem);
      letter-spacing: .07em;
    }
    #modalCard p {
      color: #c9d2f1;
      margin: 8px 0;
      line-height: 1.5;
    }
    #modalButtons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 22px;
    }
    .modalButton {
      min-height: 46px;
      padding: 0 18px;
      background: #4055ad;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.14);
    }
    .modalButton.secondary { background: #273055; }
    #levelGrid {
      display: grid;
      grid-template-columns: repeat(6, minmax(38px, 1fr));
      gap: 8px;
      margin-top: 20px;
    }
    .levelButton {
      min-height: 42px;
      padding: 0;
      background: #334374;
    }
    .levelButton.locked {
      color: #7f89ab;
      background: #1b213d;
      cursor: not-allowed;
    }
    .levelButton.done { box-shadow: inset 0 -3px 0 #7af2ae; }
    .bestTime { display: block; color: #aeb9df; font-size: .7rem; letter-spacing: 0; }
    #liveStatus {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }
    @media (max-width: 560px) {
      #app { padding: 9px; }
      #gameFrame { border-radius: 16px; }
      #gameControls { grid-template-columns: 1fr auto; gap: 10px; }
      .utility { grid-column: 1 / 3; order: 3; justify-content: center; }
      #dpad { grid-column: 1; justify-content: start; }
      #modeButton { grid-column: 2; min-width: 0; min-height: 84px; padding: 8px 14px; }
      #modalCard { padding: 22px 16px; }
    }
  </style>
</head>
<body>
  <main id="app" aria-label="Night Shift Delivery game">
    <section id="gameFrame">
      <canvas id="game" width="960" height="540" aria-label="Night Shift Delivery puzzle game"></canvas>
      <div id="modal" class="hidden" role="dialog" aria-modal="true" aria-live="polite">
        <section id="modalCard">
          <h2 id="modalTitle"></h2>
          <p id="modalText"></p>
          <div id="levelGrid" hidden></div>
          <div id="modalButtons"></div>
        </section>
      </div>
    </section>

    <nav id="gameControls" aria-label="Game controls">
      <div id="dpad" aria-label="Move courier">
        <button class="moveButton" data-move="up" aria-label="Move up">▲</button>
        <button class="moveButton" data-move="left" aria-label="Move left">◀</button>
        <button class="moveButton" data-move="down" aria-label="Move down">▼</button>
        <button class="moveButton" data-move="right" aria-label="Move right">▶</button>
      </div>
      <button id="modeButton" data-mode="day" aria-label="Switch to Night mode">☀ SWITCH TO NIGHT</button>
      <div class="utility">
        <button id="restartButton" class="smallButton" aria-label="Restart level" title="Restart level (R)">↻</button>
        <button id="pauseButton" class="smallButton" aria-label="Pause game" title="Pause (P)">Ⅱ</button>
        <button id="soundButton" class="smallButton" aria-label="Mute sound" title="Mute sound (M)">♬</button>
      </div>
    </nav>
    <div id="liveStatus" aria-live="polite"></div>
  </main>

  <script src="game.js"></script>
  
</body>
</html>
